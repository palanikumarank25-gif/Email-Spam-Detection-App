apiVersion: apps/v1

kind: Deployment

metadata:
  name: spam-prediction-deployment
  labels:
    app: spam-prediction
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spam-prediction
  template:
    metadata:
      labels:
        app: spam-prediction
    spec:
      containers:
      - name: spam-prediction-container
        image: palanikumaran/spam_prediction:latest
        ports:
        - containerPort: 8501


apiVersion: v1

kind: Service
metadata:
  name: spam-prediction-service
spec:
  selector:
    app: spam-prediction
  type: NodePort
  ports:
    - protocol: TCP
      port: 8501
      targetPort: 8501
      nodePort: 30007
